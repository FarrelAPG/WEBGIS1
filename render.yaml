services:
  - type: web
    name: sigap-damkar
    runtime: docker
    region: singapore
    plan: free
    branch: main
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: APP_KEY
        generateValue: true

